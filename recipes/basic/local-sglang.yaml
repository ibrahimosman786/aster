# Local inference (SGLang) — 1+ GPUs, recipe, no training.
# Aster creates the SGLang and HTTP processes from the inference settings.
# Set CUDA_VISIBLE_DEVICES=0 to select a particular GPU.
#
# inference.model-path accepts a local HF model directory or an HF repo ID
# (e.g. Qwen/Qwen2.5-7B-Instruct); the repo ID is auto-downloaded on start.
#
# Start the configured stack with
# `aster serve -c recipes/basic/local-sglang.yaml`. Aster waits for the engine
# before accepting traffic. ${ASTER_TOKEN} is filled from ASTER_TOKEN when
# ASTER_TOKEN is unset.
#   export ASTER_TOKEN=$(openssl rand -hex 16)

aster:
  host: 0.0.0.0
  port: 8900
  token: ${ASTER_TOKEN}
inference:
  model-path: Qwen/Qwen2.5-7B-Instruct
  backend: sglang
  tensor-parallel-size: 1
recipe:
  implementation: recipe
storage:
  agent-record-dir: .aster/agent-record
