# External provider inference — no GPU, no local model.
# One process: aster (serve), proxying to an HTTP provider.
#
# Start the configured service with
# `aster serve -c recipes/basic/external-provider.yaml`.
# The provider is named below; edit it there rather than exporting it. The two
# values this file cannot carry are read from the environment at launch time:
# the service credential and the provider's key.
#   export ASTER_TOKEN=$(openssl rand -hex 16)
#   export ASTER_UPSTREAM_API_KEY=sk-...

aster:
  host: 0.0.0.0
  port: 8900
  # Use tokens: [...] to accept several credentials during rotation.
  token: ${ASTER_TOKEN}
recipe:
  implementation: recipe
# The OpenAI-compatible provider (no /v1 suffix), its credential, and model.
inference:
  upstream-url: https://api.openai.com
  upstream-api-key: ${ASTER_UPSTREAM_API_KEY}
  upstream-model: gpt-4o
  timeout-s: 300
storage:
  artifact-work-dir: .aster/artifact-work
  artifact-cache-dir: .aster/artifact-cache
  agent-record-dir: .aster/agent-record
