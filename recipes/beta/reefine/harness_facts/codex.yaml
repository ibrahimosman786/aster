# What Reefine's prompts say about Codex CLI: see recipes/beta/reefine/harness_facts/__init__.py.
title: Codex CLI
command: >-
  Codex has no custom slash commands: a typed /<word> that is not one of its own commands is refused before the
  model sees it. A command file renders as a skill of the plugin aster, which a person types as $aster:<name> in the
  session, so every place that tells the person how to use it says $aster:<name>, never /<name>. Its text is a
  SKILL.md: YAML frontmatter with name and description, then the instructions; what the person typed after
  $aster:<name> stays in their message.
tools: >-
  exec_command (a shell, sandboxed to the workspace without network), write_stdin, request_user_input, view_image,
  multi_agent_v1, the goal tools and web_search (the hosted web search, off)
conversation_mode:
  name: Codex
  skill: >-
    Codex puts a typed $aster:<name> skill into the message as a <skill> block with its <name>
  escape: >-
    Codex runs a line that starts with ! in the person's shell
  toggle: skill
