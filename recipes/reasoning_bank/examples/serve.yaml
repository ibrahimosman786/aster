# ReasoningBank on pi, online and without ground truth: the served model's own traffic teaches the memory.
#
# Every model call that a pi client sends through this Aster is one trace (the inference stages of the pipeline
# section), so no client has to report a score. A call that ends with a reply ends a run. The judge labels the run
# a success or a failure, the extractor writes at most three memory items from it, and the step publishes the bank
# at once as the skills skills/rb-*/SKILL.md (evaluation policy none). Start it from the repository root:
#
#   aster serve -c recipes/reasoning_bank/examples/serve.yaml
#
# When the clients report a score for each run (POST /aster/report), delete the pipeline section. Each trace is then
# a scored run, and its score decides the outcome instead of the judge.

aster:
  host: 127.0.0.1
  port: 8900
  # Unset ASTER_TOKEN leaves this loopback demo without authentication; set it to require a Bearer token.
  token: ${ASTER_TOKEN}
  run-dir: .aster/reasoning-bank/run

recipe:
  implementation: aster.recipe.harness:HarnessEvolutionRecipe
  config:
    evolution:
      adapter: pi
      method:
        module: recipes.reasoning_bank:ReasoningBank
        config:
          # The served model judges and extracts, as in the paper. To use another model, declare it under
          # evolution.models (url, model, api_key_env) and give its name here.
          judge_model: served
          extract_model: served
          max_items_per_trace: 3
          max_items: 50
      state_dir: .aster/reasoning-bank/harness
      evaluation:
        # No runs: every step whose tree passes validation publishes.
        policy: none

pipeline:
  record2sample:
    module: aster.record2sample.traces:InferenceSamples
  sample2job:
    config:
      # One step reads eight model calls. Most of them are calls in the middle of a run, which cost nothing.
      job_samples: 8

inference:
  upstream-url: http://127.0.0.1:8000
  upstream-api-key: ${ASTER_UPSTREAM_API_KEY}
  upstream-model: qwen3-8b

storage:
  agent-record-dir: .aster/reasoning-bank/agent-record
  artifact-repository: .aster/reasoning-bank/artifacts.git
  artifact-work-dir: .aster/reasoning-bank/artifact-work
  artifact-cache-dir: .aster/reasoning-bank/artifact-cache
