# The Aster training stack for CEO-Bench (Aster, Ray, Slime/Megatron, SGLang) in
# the aster image. run.sh supplies image, paths, GPU pool, and a per-run token.
# The simulator roles are external services (the benchmark's Anthropic
# defaults, or a local OpenAI-compatible server) and are not started here.
services:
  aster:
    image: ${ASTER_IMAGE}
    container_name: aster-ceobench
    command: aster serve -c /workspace/Aster/recipes/sao/examples/ceobench/serve.yaml
    # Host networking: the task container reaches Aster on the machine's IP,
    # and the serving engines bind to that same IP.
    network_mode: host
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Four actor GPUs (the critic on the same GPUs) and a two-GPU rollout engine.
              device_ids:
                - "${ASTER_GPU_0:-0}"
                - "${ASTER_GPU_1:-1}"
                - "${ASTER_GPU_2:-2}"
                - "${ASTER_GPU_3:-3}"
                - "${ASTER_GPU_4:-4}"
                - "${ASTER_GPU_5:-5}"
              capabilities: [gpu]
    volumes:
      - ${MODEL_DIR}:/root/models
      - ${RUN_DIR}:/var/lib/aster
      - ${ASTER_ROOT}:/workspace/Aster
    environment:
      RAY_ADDRESS: ${RAY_ADDRESS:-}
      ASTER_TOKEN: ${ASTER_TOKEN}
      PYTHONPATH: /workspace/Aster:/root/Megatron-LM
      # Two resident 27B bases beside one step's activations leave little
      # slack; expandable segments keep the caching allocator from fragmenting.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      WANDB_API_KEY: ${WANDB_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:28900/healthz"]
      interval: 10s
      timeout: 5s
      # The stack boots in a few minutes on H100s; 120 x 10s is the ceiling.
      retries: 120
      start_period: 30s
