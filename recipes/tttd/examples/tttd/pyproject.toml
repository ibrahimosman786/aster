[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-tttd-harness"
version = "0.1.0"
description = "TTT-Discover harness that talks to an Aster service"
requires-python = ">=3.12"
dependencies = [
    "reef-client",
    "reef-eval[harbor]",
    "numpy",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
