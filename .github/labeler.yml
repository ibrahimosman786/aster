"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".pre-commit-config.yaml"

"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - "aster/core/**"
          - "aster/scenario/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "**/*.rst"
          - "docs/**"
          - "README*"

"area: examples":
  - changed-files:
      - any-glob-to-any-file: "recipes/*/examples/**"
      - any-glob-to-any-file: "recipes/basic/**"

"area: harness":
  - changed-files:
      - any-glob-to-any-file:
          - "aster/harness/**"
          - "recipes/sao/**"
          - "recipes/tttd/**"
          - "recipes/openclawrl/**"
          - "aster/train/harness_backend/**"
          - "aster/artifact/components.py"
          - "tutorials/evolve-your-harness/**"
          - "recipes/gepa/**"
          - "tests/aster_service/test_harness*.py"
          - "tests/aster_service/test_*recipe*.py"
          - "tests/smoke/**"

"area: packaging":
  - changed-files:
      - any-glob-to-any-file:
          - "docker/**"
          - "pyproject.toml"
          - "third_party/**"

"area: service":
  - changed-files:
      - any-glob-to-any-file:
          - "aster/cli.py"
          - "aster/service/**"
          - "tests/aster_service/**"

"area: training":
  - changed-files:
      - any-glob-to-any-file:
          - "aster/artifact/**"
          - "aster/dispatcher/**"
          - "aster/execution/executor/**"
          - "aster/train/**"
          - "recipes/*/examples/*/serve.yaml"
          - "tests/aster_service/test_async*.py"
          - "tests/aster_service/test_*artifact*.py"
          - "tests/aster_service/test_*checkpoint*.py"
          - "tests/aster_service/test_*runtime*.py"
          - "tests/aster_service/test_sao*.py"
          - "tests/aster_service/test_slime*.py"
          - "tests/aster_service/test_*training*.py"
          - "tests/aster_service/test_*weight*.py"
          - "tests/slime_backend/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/dependabot.yml"
          - "**/package-lock.json"
          - "**/package.json"
          - "**/pyproject.toml"
          - "**/requirements*.txt"
          - "docker/**/Dockerfile*"

"type: tests":
  - changed-files:
      - any-glob-to-all-files:
          - "tests/**"
          - "**/test_*.py"
