# Installed-wheel smoke config: Aster proxies to a deliberately unreachable
# provider, but startup and /healthz need only the core distribution.
aster:
  host: 127.0.0.1
  port: 18900
  token: package-smoke
  run-dir: .aster/run

recipe:
  implementation: recipe
inference:
  upstream-url: http://127.0.0.1:1
  upstream-model: package-smoke
storage:
  artifact-repository: .aster/artifacts.git
  artifact-work-dir: .aster/artifact-work
  artifact-cache-dir: .aster/artifact-cache
  agent-record-dir: .aster/agent-record
